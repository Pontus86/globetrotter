<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Globetrotter · Minispels-testbänk (39 spel)</title>
  <link rel="stylesheet" href="css/game.css">
  <style>
    body {
      margin: 0;
      background: #120d08;
      color: #f4ead6;
      font-family: Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .dbg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: linear-gradient(180deg, #271b10 0%, #171009 100%);
      border-bottom: 2px solid #b88b43;
      gap: 12px;
      flex-wrap: wrap;
    }
    .dbg-header h1 {
      margin: 0;
      font-size: 20px;
      color: #ffd875;
      letter-spacing: 1px;
    }
    .dbg-header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dbg-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 0;
    }
    .dbg-sidebar {
      background: #1a130b;
      border-right: 2px solid #59462f;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 60px);
    }
    .dbg-search-wrap {
      padding: 10px;
      border-bottom: 1px solid #423322;
    }
    .dbg-search {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      background: #f6efe0;
      color: #1c140c;
      border: 2px inset #9e7537;
      border-radius: 4px;
      font-family: Georgia, serif;
      font-size: 13px;
    }
    .dbg-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dbg-cat {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.4px;
      color: #c99a45;
      text-transform: uppercase;
      margin: 8px 4px 2px;
    }
    .dbg-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      background: rgba(255, 248, 230, 0.05);
      border: 1px solid rgba(184, 139, 67, 0.25);
      border-radius: 4px;
      color: #f4ead6;
      font-family: Georgia, serif;
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
    }
    .dbg-item:hover {
      background: rgba(255, 216, 117, 0.14);
      border-color: #d4a64a;
    }
    .dbg-item.active {
      background: rgba(255, 190, 61, 0.22);
      border-color: #ffd875;
      color: #fff6d6;
      font-weight: bold;
    }
    .dbg-item code {
      font-size: 10px;
      color: #bfa882;
      font-family: 'Courier New', monospace;
    }
    .dbg-main {
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      overflow-y: auto;
      max-height: calc(100vh - 60px);
    }
    .dbg-stage-host {
      width: 100%;
      max-width: 820px;
    }
    .dbg-console {
      width: 100%;
      max-width: 820px;
      background: #0d0a07;
      border: 1px solid #59462f;
      border-radius: 6px;
      padding: 10px 14px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #d8c7a6;
    }
    .dbg-console h4 {
      margin: 0 0 6px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #ffd875;
      text-transform: uppercase;
    }
    .dbg-log-entry {
      padding: 3px 0;
      border-bottom: 1px dotted rgba(184, 139, 67, 0.2);
    }
    .dbg-log-ok { color: #78e08f; }
    .dbg-log-fail { color: #ff7675; }
  </style>
</head>
<body>
  <header class="dbg-header">
    <div>
      <h1>★ GLOBETROTTER · MINISPELS-TESTBÄNK (<span id="totalCount">39</span> SPEL)</h1>
      <div style="font-size:11.5px; color:#c9b48f;">Välj valfritt minispel i listan till vänster för att testa och debugga direkt.</div>
    </div>
    <div class="dbg-header-actions">
      <button class="globe-brass-btn" id="btnRestart">Starta om aktuellt</button>
      <button class="globe-brass-btn" id="btnNext">Nästa spel »</button>
      <a class="globe-brass-btn" href="index.html" style="text-decoration:none;">« Tillbaka till spelet</a>
    </div>
  </header>

  <div class="dbg-layout">
    <aside class="dbg-sidebar">
      <div class="dbg-search-wrap">
        <input id="searchBox" class="dbg-search" type="text" placeholder="Sök minispel (t.ex. fisk, spion, isbjörn)...">
      </div>
      <div class="dbg-list" id="gameList"></div>
    </aside>

    <main class="dbg-main">
      <div class="dbg-stage-host" id="stageHost">
        <div style="text-align:center; padding:48px 20px; border:2px dashed #6b4e2e; border-radius:8px; color:#c9b48f;">
          Välj ett minispel i listan till vänster för att starta det direkt!
        </div>
      </div>

      <div class="dbg-console">
        <h4>Debug- &amp; Resultatlogg</h4>
        <div id="debugLog">
          <div class="dbg-log-entry">Redo. Klicka på ett spel för att börja testa.</div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/minigames.js"></script>
  <script src="js/minigames_pack.js"></script>
  <script>
    (function () {
      'use strict';

      const CATALOG = [
        // Arkad & Canvas (9 st)
        { cat: 'Arkad & Skicklighet (9 st)', id: 'arctic',    title: 'Arktisk naturbevakare (Isbjörnar på Grönland)' },
        { cat: 'Arkad & Skicklighet (9 st)', id: 'lander',    title: 'Raketlandaren' },
        { cat: 'Arkad & Skicklighet (9 st)', id: 'piano',     title: 'Konsertpianisten (Web Audio)' },
        { cat: 'Arkad & Skicklighet (9 st)', id: 'navigator', title: 'Skeppsnavigatören' },
        { cat: 'Arkad & Skicklighet (9 st)', id: 'camera',    title: 'Pressfotografen' },
        { cat: 'Arkad & Skicklighet (9 st)', id: 'diver',     title: 'Skattdykaren' },
        { cat: 'Arkad & Skicklighet (9 st)', id: 'stoker',    title: 'Ånglokets eldare' },
        { cat: 'Arkad & Skicklighet (9 st)', id: 'slalom',    title: 'Alpinslalom' },
        { cat: 'Arkad & Skicklighet (9 st)', id: 'passport',  title: 'Passkontrollanten' },

        // Rullbandssorterare (5 st)
        { cat: 'Rullbandssorterare · Foto (5 st)', id: 'mg_fish',    title: 'Fisksorteraren i Hamnen' },
        { cat: 'Rullbandssorterare · Foto (5 st)', id: 'mg_fruit',   title: 'Fruktsorteraren på Marknaden' },
        { cat: 'Rullbandssorterare · Foto (5 st)', id: 'mg_mail',    title: 'Postsorteraren (Flygpost)' },
        { cat: 'Rullbandssorterare · Foto (5 st)', id: 'mg_spice',   title: 'Kryddsorteraren i Basaren' },
        { cat: 'Rullbandssorterare · Foto (5 st)', id: 'mg_baggage', title: 'Bagagehanteraren på Flygplatsen' },

        // Spion, Detektiv & Guide (5 st)
        { cat: 'Spion, Detektiv & Guide · Foto (5 st)', id: 'mg_spy',           title: 'Spionjägaren (Hemliga Telegram)' },
        { cat: 'Spion, Detektiv & Guide · Foto (5 st)', id: 'mg_detective',     title: 'Privatdetektiven (Fotofallen)' },
        { cat: 'Spion, Detektiv & Guide · Foto (5 st)', id: 'mg_curator',       title: 'Konst- & Museiexperten' },
        { cat: 'Spion, Detektiv & Guide · Foto (5 st)', id: 'mg_archaeologist', title: 'Arkeologen (Världsarvsfynd)' },
        { cat: 'Spion, Detektiv & Guide · Foto (5 st)', id: 'mg_tourguide',     title: 'Stadsguiden (Snabbfotoguidning)' },

        // Kikare & Safari (4 st)
        { cat: 'Kikare & Safari · Foto (4 st)', id: 'mg_birds',     title: 'Fågelskådaren vid Kusten' },
        { cat: 'Kikare & Safari · Foto (4 st)', id: 'mg_safari',    title: 'Fotosafari vid Kilimanjaro' },
        { cat: 'Kikare & Safari · Foto (4 st)', id: 'mg_paparazzi', title: 'Kändisfotografen i Storstan' },
        { cat: 'Kikare & Safari · Foto (4 st)', id: 'mg_whale',     title: 'Havsspanaren vid Barriärrevet' },

        // Kök, Kafé & Bartender (5 st)
        { cat: 'Kök, Kafé & Bar · Foto (5 st)', id: 'mg_sushi',     title: 'Sushikocken i Tokyo' },
        { cat: 'Kikare & Bar', id: 'mg_barista',   title: 'Espressomästaren på Kaféet' },
        { cat: 'Kök, Kafé & Bar · Foto (5 st)', id: 'mg_bartender', title: 'Bartendern på Hotellbaren' },
        { cat: 'Kök, Kafé & Bar · Foto (5 st)', id: 'mg_taco',      title: 'Taqueria-kocken i Mexico City' },
        { cat: 'Kök, Kafé & Bar · Foto (5 st)', id: 'mg_curry',     title: 'Kryddkocken i Delhi & Bangkok' },

        // Minnesspel (3 st)
        { cat: 'Fotografiska Minnesspel (3 st)', id: 'mg_antiques',   title: 'Antikhandlaren i Basaren' },
        { cat: 'Fotografiska Minnesspel (3 st)', id: 'mg_flags_mem',  title: 'Diplomatens Flaggarkiv' },
        { cat: 'Fotografiska Minnesspel (3 st)', id: 'mg_museum_mem', title: 'Museiintendentens Porträttsal' },

        // Precision & Tajming (5 st)
        { cat: 'Precision & Tajming · Foto (5 st)', id: 'mg_nails',     title: 'Snickaren (Spikaren)' },
        { cat: 'Precision & Tajming · Foto (5 st)', id: 'mg_architect', title: 'Arkitekten (Valvbyggaren)' },
        { cat: 'Precision & Tajming · Foto (5 st)', id: 'mg_luthier',   title: 'Fiolbyggaren (Stämning)' },
        { cat: 'Precision & Tajming · Foto (5 st)', id: 'mg_safe',      title: 'Låssmeden (Kassaskåpet)' },
        { cat: 'Precision & Tajming · Foto (5 st)', id: 'mg_auction',   title: 'Auktionsutroparen' },

        // Telegraf, Växling & Tull (3 st)
        { cat: 'Telegraf, Växling & Tull · Foto (3 st)', id: 'mg_telegraph', title: 'Telegrafisten (Morsekod)' },
        { cat: 'Telegraf, Växling & Tull · Foto (3 st)', id: 'mg_cashier',   title: 'Växlingskontoret (Snabbväxel)' },
        { cat: 'Telegraf, Växling & Tull · Foto (3 st)', id: 'mg_customs',   title: 'Tullinspektören (Bagageröntgen)' }
      ];
      // Fixa kategorin på mg_barista så alla 5 köksspel hamnar under samma rubrik
      CATALOG.find(x => x.id === 'mg_barista').cat = 'Kök, Kafé & Bar · Foto (5 st)';

      document.getElementById('totalCount').textContent = CATALOG.length;
      const listEl = document.getElementById('gameList');
      const hostEl = document.getElementById('stageHost');
      const logEl = document.getElementById('debugLog');
      const searchEl = document.getElementById('searchBox');
      let currentIdx = -1;
      let startedAt = 0;

      function addLog(html, cls = '') {
        const div = document.createElement('div');
        div.className = 'dbg-log-entry ' + cls;
        div.innerHTML = `[${new Date().toLocaleTimeString('sv-SE')}] ${html}`;
        logEl.prepend(div);
      }

      window.addEventListener('error', e => {
        addLog(`<b>JS-FEL:</b> ${e.message} (${e.filename}:${e.lineno})`, 'dbg-log-fail');
      });

      function renderList(filter = '') {
        const q = filter.trim().toLowerCase();
        listEl.innerHTML = '';
        let lastCat = '';
        CATALOG.forEach((item, idx) => {
          if (q && !item.title.toLowerCase().includes(q) && !item.id.toLowerCase().includes(q)) return;
          if (item.cat !== lastCat) {
            const h = document.createElement('div');
            h.className = 'dbg-cat';
            h.textContent = item.cat;
            listEl.appendChild(h);
            lastCat = item.cat;
          }
          const btn = document.createElement('button');
          btn.className = 'dbg-item' + (idx === currentIdx ? ' active' : '');
          btn.innerHTML = `<span>${item.title}</span><code>${item.id}</code>`;
          btn.onclick = () => launchGame(idx);
          listEl.appendChild(btn);
        });
      }

      function launchGame(idx) {
        if (idx < 0 || idx >= CATALOG.length) return;
        currentIdx = idx;
        const item = CATALOG[idx];
        renderList(searchEl.value);
        startedAt = performance.now();
        addLog(`Startade <b>${item.title}</b> (<code>${item.id}</code>)`);

        window.GT_MINIGAMES.start(item.id, hostEl, (res) => {
          const secs = ((performance.now() - startedAt) / 1000).toFixed(1);
          addLog(
            `Avslutade <b>${item.id}</b> på ${secs}s → score: <b>${res.score}/${res.max}</b> · passed: <b>${res.passed}</b> · "${res.summary}"`,
            res.passed ? 'dbg-log-ok' : 'dbg-log-fail'
          );
          hostEl.innerHTML = `
            <div style="text-align:center; padding:26px; border:2px dashed #c99a45; background:rgba(20,14,9,0.92); border-radius:8px;">
              <h3 style="margin:0 0 8px; color:${res.passed ? '#78e08f' : '#ff7675'};">
                ${res.passed ? '✓ GODKÄND' : '✕ EJ GODKÄND'} · ${item.title}
              </h3>
              <p style="margin:0 0 10px;">${res.summary} (Poäng: <b>${res.score}/${res.max}</b> · Tid: ${secs}s)</p>
              <div style="display:flex; justify-content:center; gap:10px;">
                <button class="stamp-action-btn" onclick="window.__dbgLaunch(${idx})">Spela igen</button>
                <button class="globe-brass-btn" onclick="window.__dbgLaunch(${(idx + 1) % CATALOG.length})">Nästa spel »</button>
              </div>
            </div>
          `;
        });
      }

      window.__dbgLaunch = launchGame;
      searchEl.oninput = () => renderList(searchEl.value);
      document.getElementById('btnRestart').onclick = () => { if (currentIdx >= 0) launchGame(currentIdx); };
      document.getElementById('btnNext').onclick = () => launchGame((currentIdx + 1) % CATALOG.length);

      renderList();
    })();
  </script>
</body>
</html>
